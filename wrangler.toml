name = "gestion-future-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Compila el dashboard (JSX -> JS) antes de dev/deploy.
[build]
command = "node scripts/build-dashboard.mjs"

[vars]
ENVIRONMENT = "production"
# Config pública del proyecto Firebase (Authentication) usada por el
# dashboard y por el Worker para verificar los ID tokens. No son
# secretos: Firebase los publica en el navegador de todas formas.
FIREBASE_PROJECT_ID = "kreadu-dd0c9"
FIREBASE_API_KEY = "AIzaSyCLWpzC7SGN_-t7SlrDiOf3rZqv59T8b0E"
FIREBASE_AUTH_DOMAIN = "kreadu-dd0c9.firebaseapp.com"

# Nómina electrónica DIAN: cada empresa carga su propia habilitación
# (certificado .p12, Software ID, PIN, TestSetId y ambiente) en el
# dashboard, botón "🏛️ DIAN". Se guarda cifrada en D1 con este secreto:
#   openssl rand -base64 32 | npx wrangler secret put DIAN_CONFIG_KEY
# Si se pierde o cambia, hay que volver a cargar la habilitación de cada
# empresa. Mientras una empresa no esté habilitada, sus XML usan valores
# de prueba y no se pueden enviar.

[[d1_databases]]
binding = "DB"
database_name = "gestion_future_db"
database_id = "272ce3a6-51d7-4fd3-9353-37347f174edb"
migrations_dir = "migrations"
