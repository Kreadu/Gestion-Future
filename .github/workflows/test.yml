name: CI/CD Pipeline - Gestion-Future

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-and-deploy:
    name: Pruebas Automatizadas y Despliegue
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configurar Python (v3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependencias de Node.js
        run: npm install

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validar Tipos y Compilación TypeScript
        run: npx tsc --noEmit

      - name: Ejecutar Pruebas Automatizadas de Nómina (Python)
        run: python3 tests/test_colombia_payroll_and_dian.py

      - name: Ejecutar Pruebas Automatizadas de Nómina y CUNE DIAN (TypeScript)
        run: npx ts-node tests/payrollAndDian.test.ts

      - name: Desplegar a Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
